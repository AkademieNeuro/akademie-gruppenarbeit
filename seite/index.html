<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stammtisch – Ergebnisse eintragen</title>
<link rel="stylesheet" href="style.css">
<style>
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.6rem;font-weight:700}
.frage{background:var(--surface);border-radius:0;padding:14px 16px;font-size:1.05rem;border:1px solid var(--line)}
.frage small{display:block;color:var(--muted);font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
#vorname{font-size:1.2rem}
.cluster{display:flex;flex-direction:column;gap:8px}
.cbtn{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:0;padding:12px 14px}
.cbtn b{display:block;font-family:var(--display);font-size:1.15rem}
.cbtn span{font-size:.9rem;color:var(--muted)}
.cbtn[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));box-shadow:inset 0 0 0 1px var(--accent)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-right:6px}
textarea{width:100%;min-height:170px;font-size:1.1rem;resize:vertical}
.send{font-size:1.2rem;padding:18px}
.ok{color:var(--accent);font-weight:700;min-height:1.5em;text-align:center;margin:0}
.back{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;align-self:flex-start}
.badge{display:inline-block;padding:6px 14px;border-radius:0;font-weight:700;color:var(--note-ink);font-family:var(--display)}
.liste{display:flex;flex-direction:column;gap:8px}
.liste div{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:8px 12px;font-size:.98rem;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="kopfleiste"><img src="bilder/logo-weiss.svg" alt="Akademie Neurodiversität" width="300" height="52"></div>
<main>
  <div>
    <div class="brand">Praxis-Stammtisch</div>
    <h1 id="titel">Ergebnisse eintragen</h1>
  </div>

  <p id="status" class="muted">Wird geladen …</p>

  <section id="schritt1" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="frage"><small>Eure Frage</small><span class="frageText"></span></div>
      <label for="vorname" style="font-family:var(--display);font-size:1.25rem;font-weight:600">Dein Vorname</label>
      <p class="muted" style="margin:-10px 0 0">Eure Gruppe heißt dann nach dir, zum Beispiel „Gruppe Anna“.</p>
      <input id="vorname" type="text" maxlength="30" autocomplete="given-name" autocapitalize="words" enterkeyhint="go">
      <button class="btn send" id="weiter" type="button" disabled>Weiter</button>
    </div>
  </section>

  <section id="schritt2" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <button class="back" id="zurueck" type="button">← Namen ändern</button>
      <span class="badge" id="gruppeBadge">Gruppe 1</span>
      <div class="frage"><small>Eure Frage</small><span class="frageText"></span></div>
      <div id="clusterWrap" hidden>
        <p style="font-weight:700;margin:0 0 8px">Wozu gehört eure Idee? Bitte antippen</p>
        <div class="cluster" id="cluster" role="radiogroup"></div>
      </div>
      <label for="text" style="font-weight:700">Eure Idee</label>
      <textarea id="text" maxlength="450" placeholder="Ein Punkt pro Absenden – ihr könnt mehrmals absenden."></textarea>
      <button class="btn send" id="senden" type="button" disabled>Absenden</button>
      <p class="ok" id="meldung" aria-live="polite"></p>
      <div id="bisherWrap" hidden>
        <p class="muted" style="margin:0 0 6px">Schon abgeschickt:</p>
        <div class="liste" id="bisher"></div>
      </div>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);
let stand = null, name = "", gewaehlt = "";

async function start() {
  try {
    stand = await Board.laden();
    if (stand.titel) $("titel").textContent = stand.titel;
    document.querySelectorAll(".frageText").forEach(el => el.textContent = stand.frage);
    $("status").hidden = true;
    let gemerkt = null;
    try { gemerkt = JSON.parse(sessionStorage.getItem("stammtischName") || "null"); } catch (e) {}
    if (gemerkt && gemerkt.stammtisch === stand.stammtisch && gemerkt.name) waehlen(gemerkt.name);
    else { $("schritt1").hidden = false; }
  } catch (e) {
    $("status").textContent = e.message + " Bitte Seite neu laden.";
    $("status").className = "fehler";
  }
}

function waehlen(n) {
  name = Board.vorname(n);
  if (!name) return;
  try { sessionStorage.setItem("stammtischName", JSON.stringify({ stammtisch: stand.stammtisch, name })); } catch (e) {}
  $("gruppeBadge").textContent = "Gruppe " + name;
  $("gruppeBadge").style.background = "var(--g1)";
  $("schritt1").hidden = true; $("schritt2").hidden = false;
  $("meldung").textContent = "";
  clusterZeigen();
  zeigeBisher();
  $("text").focus();
}

function clusterZeigen() {
  const liste = Board.cluster(stand.stammtisch);
  $("clusterWrap").hidden = !liste.length;
  $("cluster").innerHTML = "";
  liste.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "cbtn"; b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", String(gewaehlt === c.name));
    b.innerHTML = "<b></b><span></span>"; b.querySelector("b").textContent = c.name; b.querySelector("span").textContent = c.beispiel || "";
    b.onclick = () => { gewaehlt = c.name; clusterZeigen(); pruefen(); };
    $("cluster").appendChild(b);
  });
}
const brauchtCluster = () => Board.cluster(stand.stammtisch).length > 0;
function pruefen() { $("senden").disabled = !$("text").value.trim() || (brauchtCluster() && !gewaehlt); }

function zeigeBisher() {
  const eigene = (stand.eintraege || []).filter(e => e.von === "Gruppe").map(Board.zerlegen).filter(z => z.schluessel === name.toLowerCase());
  $("bisherWrap").hidden = !eigene.length;
  $("bisher").innerHTML = "";
  eigene.forEach(z => { const d = document.createElement("div"); if (z.cluster) { const t = document.createElement("span"); t.className = "tag"; t.textContent = z.cluster; d.appendChild(t); } d.appendChild(document.createTextNode(z.text)); $("bisher").appendChild(d); });
}

$("vorname").addEventListener("input", () => { $("weiter").disabled = !Board.vorname($("vorname").value); });
$("vorname").addEventListener("keydown", e => { if (e.key === "Enter" && !$("weiter").disabled) $("weiter").click(); });
$("weiter").onclick = () => waehlen($("vorname").value);
$("zurueck").onclick = () => { $("vorname").value = name; $("weiter").disabled = !name; $("schritt2").hidden = true; $("schritt1").hidden = false; };
$("text").addEventListener("input", pruefen);

$("senden").onclick = async () => {
  const text = $("text").value.trim();
  if (!text || (brauchtCluster() && !gewaehlt)) return;
  $("senden").disabled = true; $("senden").textContent = "Wird gesendet …";
  $("meldung").className = "ok"; $("meldung").textContent = "";
  try {
    const r = await Board.senden({ aktion: "eintragen", gruppe: 1, text: "Gruppe " + name + (gewaehlt ? " [" + gewaehlt + "]" : "") + ": " + text });
    if (!r.ok) throw new Error(r.fehler || "Senden fehlgeschlagen.");
    $("text").value = ""; gewaehlt = ""; clusterZeigen();
    $("meldung").textContent = "Gesendet ✓ – ihr könnt gerne noch einen Punkt schicken.";
    stand = await Board.laden(); zeigeBisher();
  } catch (e) {
    $("meldung").className = "fehler";
    $("meldung").textContent = e.message + " Dein Text ist noch da – bitte nochmal auf Absenden tippen.";
  } finally {
    $("senden").textContent = "Absenden";
    pruefen();
  }
};

start();
</script>
</body>
</html>
