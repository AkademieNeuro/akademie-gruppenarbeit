<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Stammtisch – Plenum</title>
<link rel="stylesheet" href="style.css">
<style>
main{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.top>div:first-child{flex:1 1 600px;min-width:0}
.top h1{font-size:clamp(1.4rem,2.3vw,2.1rem);font-weight:700}
.top small{display:block;color:var(--muted);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--surface);padding:5px;border-radius:0;border:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);font-weight:700;padding:9px 16px;border-radius:0}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.live{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#2e9b5f}
.dot.off{background:var(--danger)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:20px;min-width:0}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.col{border-radius:0;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--note-ink);min-width:0}
.col h3{font-weight:700;font-size:1.2rem}
.note{background:color-mix(in srgb,var(--surface) 72%,transparent);color:var(--note-ink);border-radius:0;padding:10px 36px 10px 12px;font-size:1.1rem;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.note .by{display:block;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:0;border:0;background:transparent;color:inherit;opacity:.5;font-size:1.05rem;line-height:1}
.del:hover{opacity:1;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.del.sure{opacity:1;background:var(--danger);color:#fff;width:auto;padding:0 8px;font-size:.8rem;font-weight:700}
.empty{opacity:.7;font-style:italic}

.cl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.clc{border-radius:0;padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--note-ink)}
.clc h3{font-weight:700;font-size:clamp(1.3rem,2vw,1.7rem);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.clc h3 span{font:700 .95rem var(--body);opacity:.7}
.clc .bsp{margin:-6px 0 4px;font-size:.9rem;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:color-mix(in srgb,var(--surface) 80%,transparent);border-radius:0;padding:7px 11px;font-size:1.08rem;line-height:1.3;overflow-wrap:anywhere;max-width:100%}
.chip small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.6}
.mm{overflow-x:auto;border-radius:0;background:var(--bg)}
.mm svg{display:block;min-width:760px;width:100%;height:auto}

.pres{border-radius:0;padding:clamp(20px,4vw,48px);min-height:52vh;display:flex;flex-direction:column;gap:18px;color:var(--note-ink)}
.pres h3{font-weight:700;font-size:clamp(1.8rem,4vw,3rem)}
.pres ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:12px;font-size:clamp(1.2rem,2.4vw,1.7rem);line-height:1.35}
.pnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.pnav span{color:var(--muted);font-variant-numeric:tabular-nums}

.row{display:flex;flex-wrap:wrap;gap:10px}
.row input[type=text]{flex:1 1 220px;min-width:0}
.link{font-family:ui-monospace,Menlo,monospace;font-size:.95rem;background:var(--bg);border:1px solid var(--line);border-radius:0;padding:10px 12px;overflow-wrap:anywhere;user-select:all;flex:1 1 220px;min-width:0}
#login{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
</style>
</head>
<body>
<div class="kopfleiste"><img src="bilder/logo-weiss.svg" alt="Akademie Neurodiversität" width="300" height="52"></div>

<section id="login" hidden>
  <div class="brand">Praxis-Stammtisch</div>
  <h1 style="font-size:1.8rem;font-weight:700">Plenumsansicht</h1>
  <label for="code" style="font-weight:700">Leitungscode</label>
  <input id="code" type="password" autocomplete="current-password">
  <button class="btn" id="anmelden" type="button">Öffnen</button>
  <p id="loginFehler" class="fehler" aria-live="polite"></p>
</section>

<main id="app" hidden>
  <div class="top">
    <div>
      <small id="titel">Breakout-Frage</small>
      <h1 id="frage"></h1>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-v="cluster" aria-selected="false" hidden>Cluster</button>
        <button class="tab" role="tab" data-v="mindmap" aria-selected="true">Mindmap</button>
        <button class="tab" role="tab" data-v="spalten" aria-selected="false">Spalten</button>
        <button class="tab" role="tab" data-v="praesentation" aria-selected="false">Präsentation</button>
      </div>
      <span class="live"><span class="dot" id="dot"></span><span id="liveText">aktualisiert sich live</span></span>
    </div>
  </div>

  <div id="view"></div>
</main>


<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let code = "", stand = null, letzterStand = "", ansicht = "mindmap", folie = 0, timer = null;

/* ---------- Anmelden ---------- */
try { code = localStorage.getItem("stammtischCode") || ""; } catch (e) {}
async function anmelden(c) {
  $("loginFehler").textContent = "";
  try {
    const r = await Board.senden({ aktion: "pruefen", code: c });
    if (!r.ok) { $("loginFehler").textContent = "Der Leitungscode stimmt nicht."; $("login").hidden = false; return; }
    code = c; try { localStorage.setItem("stammtischCode", c); } catch (e) {}
    $("login").hidden = true; $("app").hidden = false;
    aktualisieren(); timer = setInterval(aktualisieren, 4000);
  } catch (e) {
    $("login").hidden = false; $("loginFehler").textContent = e.message;
  }
}
$("anmelden").onclick = () => anmelden($("code").value.trim());
$("code").addEventListener("keydown", e => { if (e.key === "Enter") $("anmelden").click(); });
if (code) anmelden(code); else $("login").hidden = false;

/* ---------- Laden ---------- */
async function aktualisieren() {
  try {
    const s = await Board.laden();
    $("dot").classList.remove("off"); $("liveText").textContent = "aktualisiert sich live";
    const key = JSON.stringify(s);
    if (key === letzterStand) return;
    const neuerTermin = stand && stand.stammtisch !== s.stammtisch;
    letzterStand = key; stand = s;
    if (neuerTermin) folie = 0;
    kopf(); zeichnen();
  } catch (e) {
    $("dot").classList.add("off"); $("liveText").textContent = "Verbindung unterbrochen – versucht es weiter …";
  }
}

let clusterGesetzt = "";
function kopf() {
  const hat = Board.cluster(stand.stammtisch).length > 0, tab = document.querySelector('.tab[data-v="cluster"]');
  tab.hidden = !hat;
  // Mit Clustern gibt es nur die Cluster-Ansicht
  document.querySelector(".tabs").hidden = hat;
  if (clusterGesetzt !== stand.stammtisch) {
    clusterGesetzt = stand.stammtisch;
    ansicht = hat ? "cluster" : (ansicht === "cluster" ? "mindmap" : ansicht);
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x.dataset.v === ansicht));
  }
  $("frage").textContent = stand.frage;
  $("titel").textContent = (stand.titel ? stand.titel + " · " : "") + "Breakout-Frage";
}


/* ---------- Aktionen ---------- */
async function aktion(daten, fehlerFeld) {
  try {
    const r = await Board.senden(Object.assign({ code }, daten));
    if (!r.ok) throw new Error(r.fehler || "Das hat nicht geklappt.");
    if (fehlerFeld) $(fehlerFeld).textContent = "";
    await aktualisieren(); return true;
  } catch (e) {
    if (fehlerFeld) $(fehlerFeld).textContent = e.message; else alert(e.message);
    return false;
  }
}


document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  ansicht = t.dataset.v;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  zeichnen();
});

/* ---------- Darstellung ---------- */
// Gruppen = Vornamen der Gruppenleitungen, in der Reihenfolge des ersten Eintrags
function aeste() {
  const a = [], idx = {};
  stand.eintraege.forEach(e => {
    const z = Board.zerlegen(e);
    if (!(z.schluessel in idx)) { idx[z.schluessel] = a.length; a.push({ schluessel: z.schluessel, name: z.name, farbe: Board.farbe(a.length), eintraege: [] }); }
    a[idx[z.schluessel]].eintraege.push({ id: e.id, text: z.text, cluster: z.cluster });
  });
  return a;
}
// Cluster (Formen) aus config.js; Einträge ohne Cluster landen in „Ohne Zuordnung“
function clusterAeste() {
  const def = Board.cluster(stand.stammtisch);
  if (!def.length) return [];
  const a = def.map((c, i) => ({ name: c.name, beispiel: c.beispiel, farbe: Board.farbe(i), eintraege: [] }));
  const rest = { name: "Ohne Zuordnung", beispiel: "", farbe: "var(--line)", eintraege: [] };
  stand.eintraege.forEach(e => {
    const z = Board.zerlegen(e), ziel = a.find(c => c.name === z.cluster) || rest;
    ziel.eintraege.push({ id: e.id, text: z.text, von: z.name });
  });
  if (rest.eintraege.length) a.push(rest);
  return a;
}
const leer = '<div class="card empty" style="text-align:center;padding:40px">Noch keine Ergebnisse. Sobald eine Gruppe etwas abschickt, erscheint es hier.</div>';

function zeichnen() {
  if (!stand) return;
  const v = $("view"), a = aeste(), c = clusterAeste();
  if (ansicht === "cluster" && c.length) {
    v.innerHTML = '<div class="cl">' + c.map(k => '<div class="clc" style="background:' + k.farbe + '"><h3>' + esc(k.name) + "<span>" + k.eintraege.length + "</span></h3>" +
      (k.beispiel ? '<p class="bsp">' + esc(k.beispiel) + "</p>" : "") + '<div class="chips">' +
      (k.eintraege.length ? k.eintraege.map(e => '<div class="chip"><small>' + esc(e.von) + "</small>" + esc(e.text) + "</div>").join("") : '<div class="empty">noch leer</div>') +
      "</div></div>").join("") + "</div>";
  } else if (ansicht === "spalten") {
    if (!a.length) { v.innerHTML = leer; return; }
    v.innerHTML = '<div class="cols" id="cols"></div>';
    a.forEach(g => {
      const col = document.createElement("div");
      col.className = "col"; col.style.background = g.farbe;
      col.innerHTML = "<h3>" + esc(g.name) + "</h3>";
      g.eintraege.forEach(e => {
        const d = document.createElement("div"); d.className = "note";
        if (e.cluster) { const t = document.createElement("span"); t.className = "by"; t.textContent = e.cluster; d.appendChild(t); }
        d.appendChild(document.createTextNode(e.text));
        const x = document.createElement("button"); x.className = "del"; x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Eintrag löschen");
        x.onclick = () => {
          if (!x.classList.contains("sure")) { x.classList.add("sure"); x.textContent = "Löschen?"; setTimeout(() => { x.classList.remove("sure"); x.textContent = "×"; }, 3000); return; }
          aktion({ aktion: "loeschen", id: e.id });
        };
        d.appendChild(x); col.appendChild(d);
      });
      $("cols").appendChild(col);
    });
  } else if (ansicht === "praesentation") {
    const p = c.length ? c : a;
    if (!p.length || !stand.eintraege.length) { v.innerHTML = leer; return; }
    if (folie >= p.length) folie = 0;
    const g = p[folie], n = p.length;
    v.innerHTML = '<div class="pres" style="background:' + g.farbe + '"><h3>' + esc(g.name) + "</h3>" + (g.eintraege.length ? "<ul>" + g.eintraege.map(e => "<li>" + esc(e.text) + (e.von ? ' <small style="opacity:.6;font-size:.6em">' + esc(e.von) + "</small>" : "") + "</li>").join("") + "</ul>" : '<div class="empty">noch leer</div>') +
      '</div><div class="pnav"><button class="ghost" type="button" id="zurueck">← Zurück</button><span>' + (folie + 1) + " / " + n + '</span><button class="ghost" type="button" id="weiter">Weiter →</button></div>';
    $("zurueck").onclick = () => { folie = (folie - 1 + n) % n; zeichnen(); };
    $("weiter").onclick = () => { folie = (folie + 1) % n; zeichnen(); };
  } else {
    v.innerHTML = '<div class="mm">' + mindmap(a) + "</div>";
  }
}

document.addEventListener("keydown", e => {
  if (ansicht !== "praesentation" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight") $("weiter") && $("weiter").click();
  if (e.key === "ArrowLeft") $("zurueck") && $("zurueck").click();
});

function umbrechen(t, max, zeilen) {
  const w = t.split(/\s+/), out = []; let cur = "";
  for (const x of w) { if ((cur + " " + x).trim().length > max) { if (cur) out.push(cur); cur = x; } else cur = (cur + " " + x).trim(); }
  if (cur) out.push(cur);
  if (out.length > zeilen) { out.length = zeilen; out[zeilen - 1] = out[zeilen - 1].replace(/.{0,2}$/, "") + "…"; }
  return out;
}

function mindmap(a) {
  const W = 1100, links = [], rechts = [];
  a.forEach((g, i) => (i % 2 ? rechts : links).push(g));
  const LH = 21, PAD = 12, GAP = 10, BG = 26;
  const stapel = seite => seite.map(g => {
    const blaetter = g.eintraege.map(e => { const z = umbrechen(e.text, 30, 3); return { z, h: z.length * LH + PAD * 2 }; });
    const h = Math.max(56, blaetter.reduce((s, l) => s + l.h, 0) + GAP * Math.max(0, blaetter.length - 1));
    return { g, blaetter, h };
  });
  const L = stapel(links), R = stapel(rechts);
  const hoehe = s => s.reduce((x, y) => x + y.h, 0) + BG * Math.max(0, s.length - 1);
  const H = Math.max(hoehe(L), hoehe(R), 240) + 80, cx = W / 2, cy = H / 2;
  let formen = "", linien = "";
  const fz = umbrechen(stand.frage, 22, 9), fh = fz.length * 24 + 36;
  function platziere(seite, istLinks) {
    let y = (H - hoehe(seite)) / 2;
    seite.forEach(s => {
      const pw = Math.min(190, Math.max(140, s.g.name.length * 10 + 30)), by = y + s.h / 2, bx = istLinks ? 380 : 720, kante = istLinks ? bx - pw / 2 : bx + pw / 2;
      linien += '<path d="M' + cx + "," + cy + " C" + (cx + (bx - cx) * .5) + "," + cy + " " + (cx + (bx - cx) * .5) + "," + by + " " + bx + "," + by + '" style="fill:none;stroke:var(--line);stroke-width:3"/>';
      formen += '<rect x="' + (bx - pw / 2) + '" y="' + (by - 22) + '" width="' + pw + '" height="44" rx="0" style="fill:' + s.g.farbe + '"/><text x="' + bx + '" y="' + (by + 6) + '" text-anchor="middle" style="font:700 17px var(--display);fill:var(--navy)">' + esc(umbrechen(s.g.name, 18, 1)[0]) + "</text>";
      let ly = y;
      s.blaetter.forEach(l => {
        const lx = istLinks ? 40 : 830, lw = 230, my = ly + l.h / 2, ax = istLinks ? lx + lw : lx, mx = kante + (ax - kante) * .5;
        linien += '<path d="M' + kante + "," + by + " C" + mx + "," + by + " " + mx + "," + my + " " + ax + "," + my + '" style="fill:none;stroke:' + s.g.farbe + ';stroke-width:2.5"/>';
        formen += '<rect x="' + lx + '" y="' + ly + '" width="' + lw + '" height="' + l.h + '" rx="0" style="fill:var(--surface);stroke:' + s.g.farbe + ';stroke-width:2"/>';
        l.z.forEach((t, i) => { formen += '<text x="' + (lx + 12) + '" y="' + (ly + PAD + 16 + i * LH) + '" style="font:15px var(--body);fill:var(--ink)">' + esc(t) + "</text>"; });
        ly += l.h + GAP;
      });
      y += s.h + BG;
    });
  }
  platziere(L, true); platziere(R, false);
  const mitte = '<rect x="' + (cx - 110) + '" y="' + (cy - fh / 2) + '" width="220" height="' + fh + '" rx="0" style="fill:var(--accent)"/>' +
    fz.map((t, i) => '<text x="' + cx + '" y="' + (cy - fh / 2 + 30 + i * 24) + '" text-anchor="middle" style="font:700 17px var(--display);fill:var(--accent-ink)">' + esc(t) + "</text>").join("");
  return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Mindmap der Ergebnisse">' + linien + formen + mitte + "</svg>";
}
</script>
</body>
</html>
